<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <link rel="stylesheet" href="4style.css">

</head>
<body>

    <header>
        <h1>Kaffee Coffee Cafe</h1>
        <p>Create Your Account</p>
    </header>

    <nav aria-label="Main navigation">
        <a href="4index.html">Home</a> |
        <a href="4about.html">About</a> |
        <a href="4menu.html">Menu</a> |
        <a href="4login.html">Login</a> |
        <a href="4register.html">Register</a> |
        <a href="4contact.html">Contact</a>
    </nav>

    <main>
        <nav aria-label="Breadcrumb">
            <a href="4index.html">Home</a> / Register
        </nav>

        <section>
            <h2>Customer Registration</h2>

            <form action="#" method="post">

                <p>
                    <label for="name">Full Name:</label><br>
                    <input type="text" id="name" name="name" required>
                </p>

                <p>
                    <label for="email">Email Address:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="phone">Phone Number:</label><br>
                    <input type="tel" id="phone" name="phone" required>
                </p>

                <p>
                    <label for="password">Password:</label><br>
                    <input type="password" id="password" name="password" required>
                </p>

                <p>
                    <label for="dob">Date of Birth:</label><br>
                    <input type="date" id="dob" name="dob">
                </p>

                <button type="submit">Register</button>

            </form>

            <p>Already have an account?
                <a href="4login.html">Login Here</a>
            </p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Kaffee Coffee Cafe. All Rights Reserved.</p>
    </footer>

</body>
</html>
